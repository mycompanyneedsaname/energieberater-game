<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das Geheimnis der Wärmebrücke</title>
<meta name="description" content="Point-and-Click-Adventure zu Block 8 Teil 1: Vom Zertifikat zum ersten Projekt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#07070f; --panel:#0d0d1c; --line:#23234a; --ink:#e9e6d6; --dim:#8d8aa8;
  --verb:#6fd67f; --verb-hi:#ffe86b; --inv:#8fc8ff; --gold:#ffd166; --red:#ff6b6b;
  --font:"VT323","Courier New",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:20px;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:960px;margin:0 auto;padding-inline:12px;padding-block:8px 24px;display:flex;flex-direction:column;gap:8px;min-height:100%}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:18px;color:var(--dim)}
.hud b{color:var(--gold);font-weight:normal}
.hud .btns{display:flex;gap:6px}
.hud button{background:transparent;border:1px solid var(--line);color:var(--dim);padding:2px 10px;border-radius:4px;font-size:17px}
.hud button:hover{color:var(--ink);border-color:var(--dim)}
.screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:2px solid var(--line);overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
canvas.hot{cursor:pointer}
.speech{position:absolute;transform:translate(-50%,-100%);max-width:62%;text-align:center;font-size:clamp(14px,2.4vw,24px);line-height:1.05;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;pointer-events:none;padding:0 6px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(4,4,12,.78);padding:16px;text-align:center}
.overlay h1{font-family:var(--font);font-weight:normal;font-size:clamp(28px,6vw,58px);color:var(--gold);margin:0;line-height:1;text-shadow:3px 3px 0 #000}
.overlay p{margin:0;max-width:48ch;font-size:clamp(15px,2.6vw,22px)}
.overlay .big{background:var(--gold);color:#221a00;border:0;padding:8px 26px;font-size:clamp(18px,3vw,26px);border-radius:3px;box-shadow:3px 3px 0 #000}
.overlay .big:hover{filter:brightness(1.08)}
.overlay ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:clamp(14px,2.4vw,20px);text-align:left}
.overlay .card{background:#0d0d1c;border:1px solid var(--line);padding:12px 16px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:8px;max-height:100%;overflow:auto}
.sentence{min-height:26px;color:var(--verb-hi);font-size:clamp(16px,3vw,24px);padding:0 4px;text-align:center}
.controls{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;background:var(--panel);border:2px solid var(--line);padding:8px}
@media (max-width:560px){.controls{grid-template-columns:1fr}}
.verbs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.verbs button{background:transparent;border:1px solid transparent;color:var(--verb);font-size:clamp(17px,3vw,26px);padding:6px 4px;text-align:left;border-radius:3px}
.verbs button:hover,.verbs button.on{color:var(--verb-hi);border-color:var(--line)}
.inv{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;align-content:start;border-left:1px solid var(--line);padding-left:10px}
@media (max-width:560px){.inv{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:8px}}
.inv button{background:transparent;border:1px solid transparent;color:var(--inv);font-size:clamp(16px,2.6vw,22px);padding:5px 6px;text-align:left;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv button:hover,.inv button.on{color:var(--verb-hi);border-color:var(--line)}
.inv .empty{color:var(--dim);font-size:17px;padding:5px 6px;grid-column:1/-1}
.choices{display:none;flex-direction:column;gap:2px;grid-column:1/-1}
.choices.show{display:flex}
.choices button{background:transparent;border:1px solid transparent;color:var(--inv);text-align:left;font-size:clamp(16px,2.8vw,23px);padding:5px 8px;line-height:1.15;border-radius:3px;text-wrap:pretty}
.choices button:hover{color:var(--verb-hi);border-color:var(--line)}
.choices button .n{color:var(--dim);margin-right:8px}
.controls.choosing .verbs,.controls.choosing .inv{display:none}
.foot{font-size:16px;color:var(--dim);text-align:center}
.foot a{color:var(--inv)}
button:focus-visible{outline:2px solid var(--verb-hi);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div>Konto <b id="konto">1.500 €</b> &nbsp; Punkte <b id="pts">0</b></div>
    <div class="btns"><button type="button" id="btnNotes">Notizbuch</button><button type="button" id="btnHelp">Hilfe</button><button type="button" id="btnNew">Neu</button></div>
  </div>
  <div class="screen" id="screen">
    <canvas id="cv" width="320" height="180"></canvas>
    <div class="speech" id="speech" hidden></div>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="sentence" id="sentence">&nbsp;</div>
  <div class="controls" id="controls">
    <div class="verbs" id="verbs"></div>
    <div class="inv" id="inv"></div>
    <div class="choices" id="choices"></div>
  </div>
  <p class="foot">Ein Lernspiel zu Block 8 Teil 1 · Lieber Quiz statt Abenteuer? <a href="quiz.html">Zum Stationen-Quiz</a></p>
</div>

<script>
/* ===================== Grundgerüst ===================== */
const W=320,H=180;
const cv=document.getElementById("cv"), g=cv.getContext("2d");
g.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const VERBS=[["gehe","Gehe zu"],["schau","Schau an"],["rede","Rede mit"],["nimm","Nimm"],["benutze","Benutze"],["oeffne","Öffne"]];
const ITEMS={
  zeugnis:{n:"Abschlusszeugnis",d:"Mein Hochschulzeugnis. Eines der zwei Dokumente für die Listung."},
  formular:{n:"Erklärung Weiterbildung",d:"„Erklärung des Anbietenden von Weiterbildungen“ – das Formular der EEE-Liste, vom Kursanbieter ausgefüllt. Dokument Nummer zwei."},
  zollstock:{n:"Zollstock",d:"Zwei Meter Wahrheit. Für Wanddicken und Fensterlaibungen."},
  visitenkarten:{n:"Visitenkarten",d:"„Kim Kelvin – Energieberatung“. Für Multiplikatoren."},
  checkliste:{n:"Checkliste Datenaufnahme",d:"Arbeitshilfe vom Gebäudeforum für die Begehung. Dazu die Checkliste Vertragsgestaltung fürs Angebot."},
  kamera:{n:"Wärmebildkamera",d:"Herrn Webers Baumarkt-Kamera. Zeigt alles rot, wenn die Sonne scheint."}
};
const fresh=()=>({room:"buero",px:150,dir:1,inv:[],flags:{},score:0,konto:1500,started:false});
let S=fresh();
let verb=null, useItem=null, hover=null, walking=null, busy=false, frame=0, fade=0, speechRes=null, speechTimer=null, chooseRes=null, blumenkasten=null, ended=false;

function save(){ try{ localStorage.setItem("gdw-save", JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem("gdw-save"); if(s) S=Object.assign(fresh(),JSON.parse(s)); }catch(e){} }
function money(v){ return v.toLocaleString("de-DE",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})+" €"; }
function hud(){ $("konto").textContent=money(S.konto); $("pts").textContent=S.score; }
function addScore(n){ S.score+=n; hud(); save(); }
function pay(n){ S.konto=Math.round((S.konto-n)*100)/100; hud(); save(); }
function has(i){ return S.inv.includes(i); }
function give(i){ if(!has(i)){ S.inv.push(i); renderInv(); save(); } }
function take(i){ S.inv=S.inv.filter(x=>x!==i); renderInv(); save(); }
function flag(k,v=true){ S.flags[k]=v; save(); }
const F=k=>!!S.flags[k];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ===================== Sprechen & Wählen ===================== */
const SPEAKERS={
  kim:{c:"#ffffff",pos:()=>({x:S.px,y:room().floorY-36})},
  computer:{c:"#7dffb0",pos:()=>({x:220,y:62})},
  telefon:{c:"#ff9c6b",pos:()=>({x:265,y:80})},
  praemie:{c:"#f9a8ff",pos:()=>({x:222,y:58})},
  russ:{c:"#c9c9c9",pos:()=>({x:160,y:112})},
  zimmermann:{c:"#f4b860",pos:()=>({x:80,y:114})},
  arch:{c:"#8fd3ff",pos:()=>({x:250,y:114})},
  weber:{c:"#ffe08a",pos:()=>({x:210,y:122})},
  bus:{c:"#a0a0ff",pos:()=>({x:300,y:80})}
};
function say(who,text){
  return new Promise(res=>{
    const sp=SPEAKERS[who]; const p=sp.pos();
    const el=$("speech"); el.hidden=false; el.style.color=sp.c; el.textContent=text;
    const x=Math.max(70,Math.min(250,p.x)), y=Math.max(14,p.y);
    el.style.left=(x/W*100)+"%"; el.style.top=(y/H*100)+"%";
    const done=()=>{ clearTimeout(speechTimer); speechRes=null; el.hidden=true; res(); };
    speechRes=done; speechTimer=setTimeout(done, 1500+text.length*55);
  });
}
function choose(opts){
  return new Promise(res=>{
    const box=$("choices"); box.innerHTML=""; box.classList.add("show"); $("controls").classList.add("choosing");
    opts.forEach((o,i)=>box.append(Object.assign(document.createElement("button"),{type:"button",innerHTML:"<span class=n>"+(i+1)+"</span>"+o,onclick:()=>{ box.classList.remove("show"); $("controls").classList.remove("choosing"); box.innerHTML=""; chooseRes=null; res(i); }})));
    chooseRes=i=>{ const b=box.children[i]; if(b) b.click(); };
    box.firstChild?.focus({preventScroll:true});
  });
}
/* Frage mit gemischten Antworten; wiederholt bis richtig, Punkte nur beim ersten Versuch */
async function quiz(who,q,opts,correct,wrong,right){
  if(q) await say(who,q);
  let first=true;
  for(;;){
    const order=shuffle(opts.map((o,i)=>i)); const pick=await choose(order.map(i=>opts[i])); const i=order[pick];
    await say("kim",opts[i]);
    if(i===correct){ if(first) addScore(10); if(right) await say(who,right); return; }
    first=false; await say(who, typeof wrong==="function"?wrong(i):wrong);
  }
}
/* Zeile des Spielers aus Auswahl */
async function ask(opts){ const i=await choose(opts); await say("kim",opts[i]); return i; }

/* ===================== Zeichnen ===================== */
function R(x,y,w,h,c){ g.fillStyle=c; g.fillRect(x|0,y|0,w|0,h|0); }
function T(x,y,txt,c,size=10,align="center"){ g.fillStyle=c; g.font=size+"px VT323"; g.textAlign=align; g.textBaseline="alphabetic"; g.fillText(txt,x,y); }
function sky(top,bot,y0,y1){ const n=12; for(let i=0;i<n;i++){ const t=i/(n-1); g.fillStyle=mix(top,bot,t); g.fillRect(0,y0+(y1-y0)*i/n,W,(y1-y0)/n+1); } }
function mix(a,b,t){ const pa=hex(a),pb=hex(b); return "rgb("+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(",")+")"; }
function hex(h){ return [1,3,5].map(i=>parseInt(h.substr(i,2),16)); }
function win(x,y,w,h,lit){ R(x-1,y-1,w+2,h+2,"#3a2f26"); R(x,y,w,h,lit?"#ffe9a8":"#6f8ea8"); R(x+w/2-1,y,1,h,"#3a2f26"); R(x,y+h/2-1,w,1,"#3a2f26"); }
function door(x,y,w,h,c){ R(x-2,y-2,w+4,h+2,"#2a2018"); R(x,y,w,h,c); R(x+w-5,y+h/2,2,2,"#ffd166"); }
function person(x,fy,c,f,dir){
  g.save(); g.translate(x|0,fy|0); if(dir<0) g.scale(-1,1);
  const lo=f%2; // Beine
  R(-4-lo,-11,3,11,c.pants); R(1+lo,-11,3,11,c.pants); R(-5-lo,-2,4,2,c.shoes); R(1+lo,-2,4,2,c.shoes);
  R(-5,-22,10,11,c.shirt); R(-7,-21,2,8,c.shirt); R(5,-21,2,8,c.shirt); R(-7,-13,2,2,c.skin); R(5,-13,2,2,c.skin);
  if(c.tie) R(-1,-22,2,6,c.tie);
  R(-4,-30,8,8,c.skin);
  if(!c.bald) R(-4,-31,8,3,c.hair); if(c.long) { R(-5,-30,1,7,c.hair); R(4,-30,1,7,c.hair); }
  R(0,-26,1,1,"#1a1a1a"); R(3,-26,1,1,"#1a1a1a");
  if(c.glasses){ R(-1,-27,3,3,"#000"); R(2,-27,3,3,"#000"); R(0,-26,1,1,"#cfe"); R(3,-26,1,1,"#cfe"); }
  if(c.beard) R(-3,-24,7,3,c.beard);
  if(c.hat==="top"){ R(-4,-38,8,8,"#111"); R(-6,-31,12,2,"#111"); }
  if(c.hat==="brim"){ R(-3,-35,7,5,c.hatc); R(-6,-31,13,2,c.hatc); }
  if(c.hat==="helm"){ R(-4,-34,9,4,c.hatc); R(-5,-31,11,2,c.hatc); }
  if(c.clip){ R(6,-16,5,7,"#f3f3f3"); R(6,-16,5,1,"#333"); }
  if(c.cam){ R(6,-19,6,5,"#222"); R(8,-18,2,2,"#f66"); }
  g.restore();
}
const KIM={skin:"#f1c9a5",hair:"#4a2e1a",shirt:"#3d7dd8",pants:"#2b2b3d",shoes:"#1a1a1a",clip:true};
const NPC={
  praemie:{skin:"#f1c9a5",hair:"#c94f7c",shirt:"#6a3fa0",pants:"#2b2b3d",shoes:"#1a1a1a",glasses:true,long:true},
  russ:{skin:"#e8b892",hair:"#111",shirt:"#1b1b1b",pants:"#1b1b1b",shoes:"#000",hat:"top",long:true},
  zimmermann:{skin:"#e8b892",hair:"#6b4a2b",shirt:"#8b5a2b",pants:"#2b2b3d",shoes:"#1a1a1a",hat:"brim",hatc:"#3a2a1a"},
  arch:{skin:"#d9a577",hair:"#222",shirt:"#e9e9e9",pants:"#333",shoes:"#1a1a1a",glasses:true,tie:"#c33"},
  weber:{skin:"#f1c9a5",hair:"#ccc",shirt:"#c9a13a",pants:"#5a4b3a",shoes:"#1a1a1a",bald:true,beard:"#bbb",cam:true},
  fahrer:{skin:"#f1c9a5",hair:"#333",shirt:"#3a3a5a",pants:"#222",shoes:"#000",hat:"brim",hatc:"#3a3a5a"}
};

/* ===================== Räume ===================== */
const ROOMS={
buero:{ name:"Dein Büro", floorY:150, npcs:[],
  draw(){
    R(0,0,W,120,"#d8c8a2"); for(let y=0;y<120;y+=12) R(0,y,W,1,"#cdbd96");
    R(0,120,W,60,"#8b5a2b"); for(let x=0;x<W;x+=16) R(x,120,1,60,"#6f4520"); for(let y=120;y<180;y+=10) R(0,y,W,1,"#7a4d24");
    R(0,118,W,3,"#5a3a1a");
    // Fenster
    R(18,18,66,54,"#3a2f26"); g.save(); g.beginPath(); g.rect(20,20,62,50); g.clip(); sky("#7ec8ff","#cfefff",20,70); R(20,58,62,12,"#7fae5a"); R(30,40,12,8,"#fff"); R(38,36,14,8,"#fff"); R(60,30,10,6,"#fff"); g.restore(); R(50,20,2,50,"#3a2f26"); R(20,44,62,2,"#3a2f26");
    // Zertifikat
    R(108,24,44,32,"#b8892e"); R(111,27,38,26,"#fbf6e6"); R(115,31,30,2,"#333"); R(118,36,24,1,"#777"); R(118,39,24,1,"#777"); R(118,42,18,1,"#777"); R(136,44,7,7,"#c33");
    T(130,52,"ZERT.","#333",8);
    // Aktenschrank
    R(88,92,34,58,"#8a8f99"); for(let i=0;i<3;i++){ R(91,96+i*18,28,14,"#a4a9b3"); R(102,102+i*18,6,2,"#444"); }
    // Pflanze
    R(28,136,16,14,"#b5533c"); R(30,124,12,12,"#3f8f3f"); R(24,118,10,10,"#4aa34a"); R(40,120,10,10,"#4aa34a");
    // Schreibtisch
    R(168,100,126,6,"#6f4520"); R(172,106,6,44,"#5a3a1a"); R(284,106,6,44,"#5a3a1a"); R(170,106,122,2,"#4a2e14");
    // Monitor
    R(198,68,46,32,"#2b2b33"); R(201,71,40,25,F("pcOn")?"#0e2a1a":"#0b0b12"); if(F("pcOn")){ R(204,74,20,2,"#7dffb0"); R(204,78,30,2,"#7dffb0"); R(204,82,14,2,"#7dffb0"); R(204,88,4,2,frame%40<20?"#7dffb0":"#0e2a1a"); }
    R(216,100,10,3,"#1b1b22"); R(206,96,30,4,"#3a3a44"); R(250,92,30,8,"#3a3a44"); for(let i=0;i<5;i++) R(252+i*6,94,4,4,"#666");
    // Telefon
    R(256,86,24,6,"#b1262b"); R(258,80,20,6,"#d13a3f"); R(262,82,12,2,"#7a1a1a"); if(F("weberTipp")&&!F("callDone")&&frame%30<15) T(268,76,"RING","#ff6b6b",8);
    // Post
    if(!F("postTaken")){ R(174,92,20,8,"#f0e6c8"); R(176,90,20,8,"#fff8e6"); R(180,92,10,1,"#c33"); }
    // Tür
    door(292,60,26,90,"#8b5a2b"); R(296,64,18,40,"#7a4a20");
  },
  hot:[
    {id:"fenster",n:"Fenster",x:18,y:18,w:66,h:54,walk:50,schau:async()=>say("kim","Draußen: der Marktplatz. Und eine Wolke, die aussieht wie eine Wärmebrücke. Berufskrankheit.")},
    {id:"zert",n:"Zertifikat",x:108,y:24,w:44,h:32,walk:130,schau:async()=>{ await say("kim","Mein Zertifikat. Frisch gerahmt."); await say("kim","Damit darf ich jetzt Förderanträge stellen? Nein. Erst mit dem Eintrag auf der EEE-Liste. Ohne Listung keine Anträge."); },
      nimm:async()=>say("kim","Das bleibt an der Wand. Für die Listung brauche ich mein Abschlusszeugnis, nicht das Kurszertifikat.")},
    {id:"schrank",n:"Aktenschrank",x:88,y:92,w:34,h:58,walk:112,def:"oeffne",schau:async()=>say("kim","Mein Aktenschrank. Drei Schubladen: Zeugnisse, Zollstöcke, Zweifel."),
      oeffne:async()=>{ if(has("zeugnis")&&has("zollstock")){ await say("kim","Nur noch Zweifel drin."); return; } give("zeugnis"); give("zollstock"); await say("kim","Mein Hochschulzeugnis. Und ein Zollstock, der schon mehr Wände gesehen hat als ich."); },
      nimm:async()=>ROOMS.buero.hot[2].oeffne()},
    {id:"pflanze",n:"Pflanze",x:22,y:116,w:26,h:34,walk:44,schau:async()=>say("kim","Sie steht direkt an der Außenwand. Ungedämmt. Sie friert, ich sehe es."),nimm:async()=>say("kim","Die bleibt. Sie ist mein einziger Kollege.")},
    {id:"pc",n:"Computer",x:196,y:66,w:50,h:36,walk:212,def:"benutze",schau:async()=>say("kim","Mein Rechner. Beratersoftware, Browser, und ein Ordner namens „Später“."),benutze:computer,
      use:async it=>{ if(it==="zeugnis"||it==="formular"){ await say("kim","Hochladen geht über die Webseite der EEE-Liste. Ich benutze den Computer."); } else await say("kim","Das gehört nicht an den Computer."); }},
    {id:"tel",n:"Telefon",x:254,y:78,w:28,h:16,walk:262,def:"benutze",schau:async()=>say("kim","Mein Geschäftstelefon. Es hat noch nie geklingelt. Bisher."),benutze:telefon,rede:telefon},
    {id:"post",n:"Post",x:172,y:88,w:26,h:14,walk:186,def:"nimm",cond:()=>!F("postTaken"),schau:async()=>say("kim","Ein Umschlag von der EEE-Liste. Und Werbung für Wärmebildkameras."),
      nimm:async()=>{ flag("postTaken"); give("formular"); await say("kim","Die „Erklärung des Anbietenden von Weiterbildungen“ – vom Kursanbieter unterschrieben. Dokument Nummer zwei für die Listung."); await say("kim","Die Kamera-Werbung wandert ins Altpapier."); },
      oeffne:async()=>ROOMS.buero.hot[6].nimm()},
    {id:"tuer",n:"Tür zum Marktplatz",x:290,y:58,w:30,h:92,walk:300,def:"gehe",exit:{room:"markt",x:22},schau:async()=>say("kim","Da draußen sind die Kunden. Angeblich.")}
  ],
  onEnter:async()=>{ if(!F("intro")){ flag("intro"); await say("kim","Zertifikat an der Wand. Konto: 1.500 Euro. Kunden: null."); await say("kim","Zeit, das zu ändern. Ich brauche mein erstes Projekt."); await say("kim","Vielleicht erst mal die Post öffnen. Und dann: Listung, Registrierung, Versicherung. In dieser Reihenfolge, laut Kurs."); } }

/* ===================== Skripte: Computer ===================== */
async function computer(){
  flag("pcOn");
  await say("computer","Guten Tag, Kim. Wohin?");
  for(;;){
    const opts=["energie-effizienz-experten.de","DIBt – GEG-Benutzerkonto","Google Maps – Unternehmensprofil","Gebäudeforum – Arbeitshilfen"];
    if(F("callDone")&&!F("angebot")) opts.push("Angebot für Herrn Weber schreiben");
    opts.push("Ausschalten");
    const i=await choose(opts);
    if(opts[i]==="Ausschalten"){ flag("pcOn",false); await say("kim","Bildschirm aus. Der Ordner „Später“ bleibt zu."); return; }
    if(i===0) await eee(); else if(i===1) await dibt(); else if(i===2) await maps(); else if(i===3) await forum(); else await angebot();
  }
}
async function eee(){
  await say("computer","Energie-Effizienz-Experten-Liste. Registrierung und Profil.");
  if(F("listed")){ await say("computer","Dein Profil ist online. Aufrufe diese Woche: 3. Einer davon warst du."); await say("computer","Zur Erinnerung: Mit diesen Zugangsdaten stellst du auch Anträge bei BAFA und KfW."); return; }
  if(!has("zeugnis")||!has("formular")){
    await say("computer","Bitte hochladen: 1. Erklärung des Anbietenden von Weiterbildungen. 2. Abschlusszeugnis einer Hochschule oder Universität.");
    await say("kim","Mir fehlt noch: "+(!has("formular")?"das Formular der EEE-Liste":"")+(!has("formular")&&!has("zeugnis")?" und ":"")+(!has("zeugnis")?"mein Abschlusszeugnis":"")+".");
    return;
  }
  await say("computer","Dokumente geprüft: Erklärung Weiterbildung, Abschlusszeugnis. Modul: Wohngebäude. Eintragung über Weiterbildung.");
  await quiz("computer","Gebühren für das erste Jahr, netto. Welcher Betrag ist korrekt?",
    ["220 € – 100 € Prüfung plus 120 € Jahresbeitrag","100 € – nur die Prüfung, der Rest ist kostenlos","420 € – Prüfung, Referenzzuschlag und Jahresbeitrag","0 € – die Listung ist kostenlos"],0,
    i=>i===2?"Der Zuschlag von 200 € fällt nur bei Eintragung über Referenzen an. Du kommst über die Weiterbildung.":i===1?"Der Jahresbeitrag von 120 € für ein Modul kommt dazu. Und alles zzgl. 19 % MwSt.":"Die Listung ist kostenpflichtig. Prüfung einmalig 100 € je Modul, Jahresbeitrag 120 €.",
    "Korrekt. 220 € netto, 261,80 € mit 19 % MwSt. Zahlung wird abgebucht.");
  pay(261.8);
  await say("kim","Eine echte Investition. Und nächstes Jahr wieder 120 Euro. Plus Nebenadressen, falls ich mal expandiere: 10 Euro pro Stück, maximal vier.");
  await say("computer","Profil anlegen. Wähle deine Kurzbeschreibung.");
  await quiz("computer",null,
    ["Energieberatung für Ein- und Mehrfamilienhäuser in Musterstadt und Umgebung. Schwerpunkt iSFP und Baubegleitung – vom ersten Gespräch bis zum Förderantrag. Netzwerkpartner GIH.","Kim Kelvin, Energieberatung, Musterstadt. Modul Wohngebäude.","Beratung. Anrufen. Danke."],0,
    "Formal in Ordnung. Aber ein Profil mit nur Pflichtangaben ist „OK“. Eines mit Spezialisierung, Region, Arbeitsweise und Netzwerkpartner-Logo ist deutlich besser. Der erste Eindruck zählt.",
    "Profil gespeichert. Damit hebst du dich von der Konkurrenz ab.");
  flag("listed");
  await say("computer","Dein Antrag wird nach Eingangsdatum bearbeitet. Bearbeitungsdauer: je nachdem, wie früh du dran warst.");
  await say("kim","Gut, dass ich früh dran bin. Jetzt: DIBt für die Energieausweise. Und dann zur Versicherung, bevor ich irgendein Fenster öffne.");
}
async function dibt(){
  await say("computer","Deutsches Institut für Bautechnik. GEG-Benutzerkonto. Registriernummern für Energieausweise.");
  if(F("dibt")){ await say("computer","Bestand: 1 Registriernummer. Hinweis: Der Energieausweis nach GModG ist noch nicht verfügbar."); return; }
  await say("computer","Vor der ersten Bestellung: drei Kontrollfragen.");

async function angebot(){
  await say("computer","Angebotsvorlage für Herrn Weber. Wähle, was ins Angebot gehört. Schicke ab, wenn es vollständig ist.");
  const good=["Vertragsparteien und Objekt festhalten","Leistung klar und präzise beschreiben","Transparente Preisgestaltung","Förderbedingungen und Subventionshöhe erläutern","Klare Zahlungsbedingungen und Fristen","Datenschutz und Vertraulichkeit zusichern"];
  const bad={"Fachbegriffe häufen, damit es seriös wirkt":"Nein. Verständliche, leichte Sprache. Herr Weber soll es lesen, nicht übersetzen.","Preis erst nach dem Termin nennen":"Nein. Transparente Preisgestaltung gehört ins Angebot.","Zusatzleistungen mündlich vereinbaren":"Nein. Abweichende Leistungen werden vertraglich festgehalten."};
  const chosen=new Set(); let mistakes=0;
  for(;;){
    const rem=[...good.filter(x=>!chosen.has(x)),...Object.keys(bad)]; shuffle(rem);
    const opts=[...rem,"Angebot abschicken"]; const i=await choose(opts); const o=opts[i];
    if(o==="Angebot abschicken"){
      if(chosen.size===good.length){ break; }
      await say("kim","Halt. Die Checkliste Vertragsgestaltung sagt: Da fehlt noch etwas. "+(good.length-chosen.size)+" Punkt"+(good.length-chosen.size===1?"":"e")+" offen.");
      continue;
    }
    if(bad[o]){ mistakes++; await say("kim",bad[o]); continue; }
    chosen.add(o); await say("kim",o+". Rein damit.");
  }
  if(mistakes===0) addScore(20); else if(mistakes===1) addScore(10);
  flag("angebot");
  await say("computer","Angebot versendet: Vor-Ort-Begehung mit Datenaufnahme, iSFP. 1.900 € netto zzgl. 19 % MwSt. Förderhinweis: BAFA-Zuschuss, Antrag vor Vertragsschluss.");

  await say("kim","Förderung beantragt, bevor der Vertrag steht. Genau richtig herum. Dann unterschreiben Sie den Vertrag und schicken ihn zurück, und ich komme zur Begehung.");
  await say("weber","Mühlenweg 4. Linie 823 hält direkt davor.");
  await say("kim","Bevor ich fahre: Bin ich versichert? Verstöße vor Vertragsbeginn sind nicht versichert.");
}

  checkEnd();
}
function checkEnd(){ if(F("kameraDone")&&F("checklisteDone")&&F("fensterDone")&&F("heizungDone")&&F("dachDone")&&!F("finale")){ flag("finale"); setTimeout(finale,200); } }
async function finale(){
  busy=true;
  await say("kim","Daten erfasst. Ziel bestimmt. Förderung beantragt. Blumenkasten überlebt.");
  await say("weber","Und jetzt?");
  await say("kim","Jetzt schreibe ich Ihren Sanierungsfahrplan. Und Sie kaufen neue Geranien.");
  await say("weber","Sie sind gut, Kelvin. Ich empfehle Sie weiter. Frau Ruß auch.");
  await say("kim","Mein erstes Projekt. Und der zweite Kunde kommt schon per Multiplikator.");
  ended=true; flag("ended"); save();
  showEnd();
}

/* ===================== Overlays ===================== */
function overlay(html){ const o=$("overlay"); o.innerHTML=html; o.hidden=false; }
function hideOverlay(){ $("overlay").hidden=true; $("overlay").innerHTML=""; }
function showTitle(){
  overlay('<h1>Das Geheimnis der Wärmebrücke</h1><p>Ein Point-and-Click-Abenteuer vom Zertifikat zum ersten Projekt.</p><p>Du bist Kim Kelvin, frisch zertifiziert, Konto 1.500 Euro, Kunden: null. Finde den Weg zum ersten Auftrag – über Listung, Registrierung, Versicherung und Akquise bis zur Begehung.</p><button class="big" type="button" id="btnStart">'+(S.started?"Weiterspielen":"Spiel starten")+'</button>');
  $("btnStart").onclick=()=>{ hideOverlay(); S.started=true; save(); go(S.room,S.px,true); const rm=room(); if(rm.onEnter) run(rm.onEnter); };
}
function showHelp(){
  overlay('<div class="card"><h1 style="font-size:30px">So spielst du</h1><ul><li>Klicke ein Verb, dann etwas im Bild. Ohne Verb passiert das Naheliegende.</li><li>„Benutze“ + Inventar + Ziel: zum Beispiel Zollstock mit Fenster.</li><li>Klick ins Bild oder Leertaste: Text weiter. Zahlen 1–4 wählen Antworten.</li><li>Richtige Antworten beim ersten Versuch geben Punkte. Falsche kosten nur Zeit.</li><li>Das Notizbuch zeigt, was noch zu tun ist. Gespeichert wird automatisch.</li></ul><button class="big" type="button" id="btnClose">Weiter</button></div>');
  $("btnClose").onclick=hideOverlay;
}
function showNotes(){
  const todo=[["Auf der EEE-Liste eintragen (zwei Dokumente, Gebühren)",F("listed")],["Beim DIBt registrieren (Energieausweise)",F("dibt")],["Versicherungen abschließen, bevor es losgeht",F("insured")],["Gefunden und empfohlen werden (Kneipe, Google Maps)",F("weberTipp")],["Kundengespräch führen und Angebot schreiben",F("angebot")],["Vor-Ort-Begehung am Mühlenweg 4",F("finale")]];
  overlay('<div class="card"><h1 style="font-size:30px">Notizbuch</h1><ul>'+todo.map(([t,d])=>'<li style="color:'+(d?"#6fd67f":"#e9e6d6")+'">'+(d?"[x] ":"[ ] ")+t+'</li>').join("")+'</ul><p style="font-size:17px;color:#8d8aa8">Merksatz des Tages: Es liegt in der eigenen Verantwortung zu klären, welche Felder versichert sein müssen.</p><button class="big" type="button" id="btnClose">Zurück</button></div>');
  $("btnClose").onclick=hideOverlay;
}
function showEnd(){
  overlay('<div class="card"><h1 style="font-size:34px">Erstes Projekt gestartet</h1><p>Punkte: <b style="color:#ffd166">'+S.score+'</b> &nbsp; Konto: <b style="color:#ffd166">'+money(S.konto)+'</b></p><ul><li>Ohne EEE-Listung keine Förderanträge. Früh registrieren, Profil pflegen.</li><li>Energieausweise: DIBt-Konto, 6,90 € je Nummer, drei Kontrollstufen.</li><li>Beratungsfehler: Vermögensschadenhaftpflicht. Blumenkasten: Betriebshaftpflicht. Beides vor dem ersten Projekt.</li><li>Akquise: aktiv und passiv, beides.</li><li>Kundengespräch mit Leitfaden, Förderung vor Vertragsschluss, Angebot klar.</li><li>Die Begehung ist der beste Zeitpunkt für Daten. Wärmebilder brauchen Schulung.</li></ul><button class="big" type="button" id="btnAgain">Noch einmal spielen</button></div>');
  $("btnAgain").onclick=()=>{ if(confirm("Spielstand löschen und neu beginnen?")){ S=fresh(); ended=false; save(); hud(); renderInv(); showTitle(); } };
}

/* ===================== Eingabe ===================== */
function renderVerbs(){ const v=$("verbs"); v.innerHTML=""; VERBS.forEach(([k,l])=>{ const b=document.createElement("button"); b.type="button"; b.textContent=l; b.className=verb===k?"on":""; b.onclick=()=>{ verb=verb===k?null:k; useItem=null; renderVerbs(); sentence(); }; v.append(b); }); }
function renderInv(){ const v=$("inv"); v.innerHTML=""; if(!S.inv.length){ v.innerHTML='<div class="empty">Inventar leer</div>'; return; } S.inv.forEach(i=>{ const b=document.createElement("button"); b.type="button"; b.textContent=ITEMS[i].n; b.className=useItem===i?"on":""; b.onclick=()=>invClick(i); v.append(b); }); }
function sentence(h){ const vl=verb?VERBS.find(v=>v[0]===verb)[1]:""; const it=useItem?ITEMS[useItem].n+" mit":""; const t=[vl,it,h?h.n:""].filter(Boolean).join(" "); $("sentence").textContent=t||" "; }
async function invClick(i){
  if(busy) return;
  if(verb==="benutze"){ useItem=useItem===i?null:i; renderInv(); sentence(); return; }
  if(verb==="gehe"||verb==="rede"||verb==="oeffne"){ verb=null; renderVerbs(); }
  if(verb==="nimm"){ verb=null; renderVerbs(); await run(()=>say("kim","Habe ich schon.")); return; }
  await run(()=>say("kim",ITEMS[i].d));
}
async function run(fn){ busy=true; try{ await fn(); } finally{ busy=false; verb=null; useItem=null; renderVerbs(); renderInv(); sentence(hover); } }
function hotAt(x,y){ const hs=room().hot.filter(h=>!h.cond||h.cond()); for(let i=hs.length-1;i>=0;i--){ const h=hs[i]; if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h) return h; } return null; }
function canvasPos(e){ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)/r.width*W,y:(p.clientY-r.top)/r.height*H}; }
cv.addEventListener("mousemove",e=>{ const {x,y}=canvasPos(e); hover=hotAt(x,y); cv.classList.toggle("hot",!!hover); if(!busy) sentence(hover); });
cv.addEventListener("click",e=>{
  if(speechRes){ speechRes(); return; }
  if(busy) return;
  const {x,y}=canvasPos(e); const h=hotAt(x,y);
  if(!h){ walkTo(x,null); verb=null; useItem=null; renderVerbs(); renderInv(); sentence(); return; }
  const v=verb||h.def||"schau";
  const target=h.walk??x;
  if(v==="gehe"&&!h.gehe){ walkTo(target, h.exit?()=>go(h.exit.room,h.exit.x):null); verb=null; renderVerbs(); sentence(); return; }
  const item=useItem;
  walkTo(target, ()=>run(async()=>{
    if(item){ if(h.use) await h.use(item); else await say("kim","Das passt nicht zusammen."); return; }
    const fn=h[v];
    if(fn) await fn(); else await say("kim",{schau:"Nichts Besonderes.",rede:"Es antwortet nicht. Ich rede weiter mit mir selbst.",nimm:"Das nehme ich nicht mit.",benutze:"Das bringt nichts.",oeffne:"Das lässt sich nicht öffnen."}[v]);
  }));
  sentence(h);
});
$("speech").addEventListener("click",()=>{ if(speechRes) speechRes(); });
document.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){ if(speechRes){ e.preventDefault(); speechRes(); } } else if(/^[1-9]$/.test(e.key)&&chooseRes){ chooseRes(+e.key-1); } });
$("btnHelp").onclick=showHelp; $("btnNotes").onclick=showNotes;
$("btnNew").onclick=()=>{ if(confirm("Spielstand löschen und neu beginnen?")){ S=fresh(); ended=false; save(); hud(); renderInv(); showTitle(); } };

/* ===================== Bewegung & Schleife ===================== */
function walkTo(x,cb){ x=Math.max(12,Math.min(W-12,x)); walking={tx:x,cb}; if(x!==S.px) S.dir=x>S.px?1:-1; }
function go(r,x,silent){
  const doIt=()=>{ S.room=r; S.px=x; walking=null; hover=null; save(); const rm=room(); if(rm.onEnter&&!silent) run(rm.onEnter); };
  if(silent){ doIt(); return; }
  fade=1; setTimeout(doIt,220);
}
function loop(){
  frame++;
  if(walking){ const dx=walking.tx-S.px; if(Math.abs(dx)<=1.6){ S.px=walking.tx; const cb=walking.cb; walking=null; save(); if(cb) cb(); } else S.px+=Math.sign(dx)*1.6; }
  if(blumenkasten){ blumenkasten.y+=2.2; if(blumenkasten.y>=152){ const r=blumenkasten.res; blumenkasten=null; r(); } }
  const rm=room(); rm.draw();
  rm.npcs.forEach(n=>person(n.x,n.fy,NPC[n.k],0,n.dir));
  if(S.room==="versicherung") R(150,118,160,34,"#7a4b2a"), R(148,114,164,6,"#5a3a1a"), R(160,124,40,16,"#fff"), T(180,136,"PRÄMIE","#7a4b2a",10);
  person(S.px,rm.floorY,KIM,walking?Math.floor(frame/6):0,S.dir);
  if(fade>0){ g.fillStyle="rgba(0,0,0,"+fade+")"; g.fillRect(0,0,W,H); fade-=0.06; }
  requestAnimationFrame(loop);
}

/* ===================== Start ===================== */
function boot(hot){
  load(); if(hot&&hot.room) S=Object.assign(fresh(),hot);
  ended=!!S.flags.ended; hud(); renderVerbs(); renderInv(); sentence();
  window.claude?.hot?.snapshot?.(()=>S);
  loop();
  if(ended) showEnd(); else showTitle();
}
document.fonts.ready.then(()=>{ window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? null); });
</script>
