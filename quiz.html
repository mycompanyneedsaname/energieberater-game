.itemcard{background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:18px 16px;font-size:18px;font-weight:500;min-height:88px;display:flex;align-items:center;text-wrap:balance}

.doc{border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;font-size:14.5px}

.station .st{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.bar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:13px}

label.lbl{font-size:13px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:6px}

const TYPE_LABEL = {mc:"Auswahl", tf:"Richtig oder falsch", number:"Kostenrechner", sort:"Zuordnen", match:"Paare finden", order:"Reihenfolge", multi:"Mehrfachauswahl", dialog:"Kundengespräch", spot:"Fehlersuche", compare:"Profil-Vergleich"};
const MAX = STATIONS.reduce((a,s)=>a+s.tasks.length*10,0);
const RANKS = [
  [90,"Listungsreif","Du könntest morgen das erste Angebot rausschicken. Fast alles saß."],
  [75,"Fast startklar","Solide. Schau dir die Stationen mit den kürzeren Balken noch einmal an."],
  [50,"Auf dem Fahrplan","Die Richtung stimmt, aber ein paar Details fehlen noch – vor allem bei Zahlen und Zuständigkeiten."],
  [0,"Nachschulung empfohlen","Noch einmal durchspielen lohnt sich – die Erklärungen unter jeder Aufgabe sind der Stoff."]
];

/* ---------------- Zustand ---------------- */
let S = {view:"home", st:0, ti:0, score:0, stScores:[], name:""};
let best = null;
function load(){ try{ const s=localStorage.getItem("vzp-state"); if(s) S=Object.assign(S,JSON.parse(s)); const b=localStorage.getItem("vzp-best"); if(b) best=JSON.parse(b); }catch(e){} }
function save(){ try{ localStorage.setItem("vzp-state", JSON.stringify(S)); }catch(e){} }
function saveBest(){ if(!best || S.score>best.score){ best={score:S.score, date:new Date().toISOString().slice(0,10)}; try{ localStorage.setItem("vzp-best", JSON.stringify(best)); }catch(e){} } }
function reset(){ S={view:"intro", st:0, ti:0, score:0, stScores:[], name:S.name||""}; save(); render(); }

/* ---------------- Helfer ---------------- */
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null) e.setAttribute(k,v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const segVar=i=>`var(--s${i+1})`;
function shakeEl(e){ e.classList.remove("shake"); void e.offsetWidth; e.classList.add("shake"); }

/* ---------------- Rendering ---------------- */
function render(){
  const stage=document.getElementById("stage"); stage.innerHTML="";
  renderRibbon();
  document.getElementById("score").textContent=S.score+" Pkt";
  ({home:renderHome, intro:renderIntro, task:renderTask, stdone:renderStDone, end:renderEnd})[S.view](stage);
  window.scrollTo({top:0});
}
function renderRibbon(){
  const r=document.getElementById("ribbon"); r.innerHTML="";
  STATIONS.forEach((s,i)=>{
    const done = S.view==="end" || i<S.st || (i===S.st && S.view==="stdone");
    const cur = !done && i===S.st && S.view!=="home";
    r.append(el("div",{class:"seg"+(done?" done":"")+(cur?" cur":""),"data-i":i,title:s.name}));
  });
}
function stationPossible(i){ return STATIONS[i].tasks.length*10; }

function renderHome(stage){
  const inProgress = S.st>0 || S.ti>0 || S.score>0;
  const card=el("div",{class:"card"},
    el("div",{class:"eyebrow"}, "Paket 5 · Block 8 Teil 1"),
    el("h1",{class:"title"},"Vom Zertifikat zum ersten Projekt"),
    el("p",{class:"lead"},"Du hast den Kurs geschafft. Jetzt geht es um alles, was zwischen Zertifikat und erstem Auftrag liegt: Listung, Energieausweise, Versicherungen, Akquise, das erste Kundengespräch und die Begehung. Sechs Stationen, "+STATIONS.reduce((a,s)=>a+s.tasks.length,0)+" Aufgaben, "+MAX+" Punkte."),
    el("div",{class:"stations"}, STATIONS.map((s,i)=>{
      const done=i<S.st, cur=i===S.st;
      return el("div",{class:"station"+(cur&&inProgress?" cur":"")+(!done&&!cur?" locked":""),style:"--seg:"+segVar(i)},
        el("div",{class:"num"},String(i+1)),
        el("div",{}, el("div",{class:"nm"},s.name), el("div",{class:"sub"}, s.tasks.length+" Aufgaben · "+stationPossible(i)+" Punkte")),
        el("div",{class:"st"}, done ? (S.stScores[i]||0)+"/"+stationPossible(i) : cur&&inProgress ? "läuft" : "")
      );
    })),
    el("div",{class:"row"},
      el("button",{class:"btn",type:"button",onclick:()=>{ S.view = S.ti>=STATIONS[S.st].tasks.length ? "stdone" : S.ti>0 ? "task" : "intro"; save(); render(); }}, inProgress ? "Weiter bei Station "+(S.st+1) : "Los geht's"),
      inProgress ? el("button",{class:"btn ghost",type:"button",onclick:()=>{ if(confirm("Fortschritt löschen und von vorn beginnen?")) reset(); }},"Von vorn") : null
    ),
    best ? el("p",{class:"hint"},"Bestes Ergebnis in diesem Browser: "+best.score+" von "+MAX+" Punkten ("+best.date+")") : null
  );
  stage.append(card);
}

function renderIntro(stage){
  const s=STATIONS[S.st];
  stage.append(el("div",{class:"card"},
    el("div",{class:"eyebrow",style:"--seg:"+segVar(S.st)}, el("span",{class:"dot"}), "Station "+(S.st+1)+" von "+STATIONS.length),
    el("h1",{class:"title"}, s.name),
    el("p",{class:"lead"}, s.intro),
    el("p",{class:"hint"}, s.tasks.length+" Aufgaben · bis zu "+stationPossible(S.st)+" Punkte"),
    el("div",{class:"row"}, el("button",{class:"btn",type:"button",onclick:()=>{ S.view="task"; S.ti=0; save(); render(); }},"Station starten"))
  ));
}

function renderTask(stage){
  const s=STATIONS[S.st], t=s.tasks[S.ti];
  const card=el("div",{class:"card"},
    el("div",{class:"eyebrow",style:"--seg:"+segVar(S.st)}, el("span",{class:"dot"}), "Station "+(S.st+1)+" · "+s.name, el("span",{class:"chip"},"Aufgabe "+(S.ti+1)+"/"+s.tasks.length), el("span",{class:"chip"},TYPE_LABEL[t.type]))
  );
  if(t.story) card.append(el("p",{class:"story"},t.story));
  card.append(el("h2",{class:"q"},t.q));

  card.append(box);

  ({mc:rMC, tf:rTF, number:rNumber, sort:rSort, match:rMatch, order:rOrder, multi:rMulti, dialog:rDialog, spot:rSpot, compare:rCompare})[t.type](ctx);
  stage.append(card);

function finish(ctx, points, detail){
  if(ctx.done) return; ctx.done=true;
  points=clamp(Math.round(points),0,10);
  S.score+=points; S.stScores[S.st]=(S.stScores[S.st]||0)+points;
  const last = S.ti>=STATIONS[S.st].tasks.length-1;
  S.ti+=1; if(last){ S.view="stdone"; }
  save();
  document.getElementById("score").textContent=S.score+" Pkt";
  const cls = points===10?"ok":points===0?"bad":"";
  const head = points===10?"Richtig":points===0?"Leider nicht":"Teilweise richtig";
  const fb=el("div",{class:"feedback "+cls},
    el("div",{class:"head"}, el("span",{},head), el("span",{class:"pts"},"+"+points+" Pkt")),
    detail||null,
    ctx.t.explain ? el("p",{class:"sub"},ctx.t.explain) : null,
    el("div",{class:"row end"}, el("button",{class:"btn",type:"button",onclick:()=>render()}, last ? "Station abschließen" : "Weiter"))
  );
  ctx.fbHost.append(fb);
  fb.querySelector(".btn").focus({preventScroll:true});
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ---- Aufgabentypen ---- */
function rMC(ctx){
  const t=ctx.t; const opts=t.options.map((o,i)=>({o,i})); if(t.shuffle!==false) shuffle(opts);
  const list=el("div",{class:"opts"});
  opts.forEach(({o,i},k)=>{
    const b=el("button",{class:"opt",type:"button"}, el("span",{class:"k"},String.fromCharCode(65+k)), el("span",{},o));
    b.addEventListener("click",()=>{
      if(ctx.done) return;
      const ok=i===t.answer;
      [...list.children].forEach((x,j)=>{ x.disabled=true; if(opts[j].i===t.answer) x.classList.add("is-ok"); });
      if(!ok) b.classList.add("is-bad");
      finish(ctx, ok?10:0);
    });
    list.append(b);
  });
  ctx.box.append(list);
}

function rTF(ctx){
  const t=ctx.t; let i=0, correct=0;
  const counter=el("div",{class:"counter"}); const stmt=el("div",{class:"itemcard"}); const btns=el("div",{class:"tfbtns"});
  const res=el("div"); const log=el("div",{class:"log"});
  ctx.box.append(counter, stmt, btns, res, log);
  function show(){
    const it=t.items[i]; counter.textContent="Aussage "+(i+1)+" von "+t.items.length; stmt.textContent=it.s; stmt.className="itemcard"; res.innerHTML=""; btns.innerHTML="";
    [["Richtig",true],["Falsch",false]].forEach(([lab,val])=>{
      btns.append(el("button",{class:"bucket",type:"button",onclick:()=>{
        const ok=val===it.a; if(ok) correct++;
        stmt.classList.add(ok?"flash-ok":"flash-bad");
        [...btns.children].forEach(b=>b.disabled=true);
        res.append(el("div",{class:"note "+(ok?"ok":"bad")}, el("b",{}, ok?"Richtig. ":"Nein – die Aussage ist "+(it.a?"richtig. ":"falsch. ")), it.e));
        log.prepend(el("div",{class:ok?"ok":"bad"}, el("span",{class:"m"},ok?"✓":"✗"), it.s));
        i++;
        if(i<t.items.length) res.append(el("div",{class:"row end"}, el("button",{class:"btn ghost",type:"button",onclick:show},"Nächste Aussage")));
        else finish(ctx, 10*correct/t.items.length, el("p",{class:"sub"}, correct+" von "+t.items.length+" Aussagen richtig eingeschätzt."));
      }}, lab));
    });
  }
  show();
}

function rNumber(ctx){
  const t=ctx.t; let tries=0;
  const inp=el("input",{type:"number",inputmode:"decimal",id:"num-"+S.st+"-"+S.ti,placeholder:"Betrag in "+t.unit,"aria-label":"Dein Ergebnis"});
  const btn=el("button",{class:"btn",type:"button"},"Prüfen");
  const wrap=el("div",{class:"numwrap"}, inp, btn); const note=el("div");
  ctx.box.append(el("p",{class:"hint"},"Zur Erinnerung: Prüfung 100 € je Modul · Referenzen +200 € · Jahresbeitrag 120 € (ein Modul) / 170 € (zwei Module) · Nebenadresse 10 €/Jahr, max. vier."), wrap, note);
  const check=()=>{
    if(ctx.done) return; const v=parseFloat(String(inp.value).replace(",", ".")); if(isNaN(v)) { shakeEl(inp); return; }
    tries++; const ok=Math.abs(v-t.answer)<0.5;
    const calc=el("div",{class:"calc"}, t.calc.map(([l,r],k)=>[el("span",{class:k>=t.calc.length-2?"sum":""},l), el("b",{class:k>=t.calc.length-2?"sum":""},r)]));
    if(ok){ inp.disabled=true; btn.disabled=true; finish(ctx, tries===1?10:5, calc); }
    else if(tries===1){ note.innerHTML=""; note.append(el("div",{class:"note bad"}, el("b",{},"Nicht ganz. "), t.hint+" Noch ein Versuch.")); shakeEl(inp); inp.select(); }
    else { inp.disabled=true; btn.disabled=true; note.innerHTML=""; finish(ctx, 0, el("div",{}, el("p",{class:"sub"},"Richtig wären "+t.answer+" "+t.unit+" gewesen:"), calc)); }
  };
  btn.addEventListener("click",check); inp.addEventListener("keydown",e=>{ if(e.key==="Enter") check(); });
}

function rSort(ctx){
  const t=ctx.t; const items=shuffle(t.items.slice()); let i=0, correct=0; const misses=[];
  const counter=el("div",{class:"counter"}); const card=el("div",{class:"itemcard"}); const buckets=el("div",{class:"buckets"}); const log=el("div",{class:"log"});
  t.buckets.forEach((b,bi)=>buckets.append(el("button",{class:"bucket",type:"button",html:b,onclick:()=>pick(bi)})));
  ctx.box.append(counter, card, buckets, log);
  function show(){ counter.textContent="Karte "+(i+1)+" von "+items.length; card.textContent=items[i].t; card.className="itemcard"; }
  function pick(bi){
    if(ctx.done||i>=items.length) return; const it=items[i]; const ok=bi===it.b; if(ok) correct++; else misses.push(it);
    card.classList.add(ok?"flash-ok":"flash-bad");
    log.prepend(el("div",{class:ok?"ok":"bad"}, el("span",{class:"m"},ok?"✓":"✗"), it.t+(ok?"":" → "+t.buckets[it.b].replace("­",""))));
    [...buckets.children].forEach(b=>b.disabled=true);
    setTimeout(()=>{ i++; [...buckets.children].forEach(b=>b.disabled=false); if(i<items.length) show(); else { [...buckets.children].forEach(b=>b.disabled=true); finish(ctx, 10*correct/items.length, el("p",{class:"sub"}, correct+" von "+items.length+" richtig zugeordnet.")); } }, 420);
  }
  show();
}

function rMatch(ctx){
  const t=ctx.t; const n=t.pairs.length; let mistakes=0, done=0, selL=null;
  const left=t.pairs.map((p,i)=>({t:p[0],i})); const right=shuffle(t.pairs.map((p,i)=>({t:p[1],i})));
  const colL=el("div",{class:"col"}), colR=el("div",{class:"col"});
  const status=el("div",{class:"counter"},"0 von "+n+" Paaren · 0 Fehlversuche");
  left.forEach(o=>{ const b=el("button",{class:"tile",type:"button"},o.t); b.dataset.i=o.i; b.addEventListener("click",()=>{ if(b.classList.contains("is-done")) return; colL.querySelectorAll(".tile").forEach(x=>x.classList.remove("is-sel")); b.classList.add("is-sel"); selL=b; }); colL.append(b); });
  right.forEach(o=>{ const b=el("button",{class:"tile",type:"button"},o.t); b.dataset.i=o.i; b.addEventListener("click",()=>{
    if(b.classList.contains("is-done")||ctx.done) return;
    if(!selL){ shakeEl(b); return; }
    if(selL.dataset.i===b.dataset.i){ selL.classList.remove("is-sel"); selL.classList.add("is-done"); b.classList.add("is-done"); selL.disabled=true; b.disabled=true; selL=null; done++; }
    else { mistakes++; shakeEl(b); shakeEl(selL); }
    status.textContent=done+" von "+n+" Paaren · "+mistakes+" Fehlversuche";
    if(done===n) finish(ctx, 10*(n-mistakes)/n, el("p",{class:"sub"}, mistakes===0?"Alle Paare ohne Fehlversuch gefunden.":mistakes+" Fehlversuch"+(mistakes===1?"":"e")+"."));
  }); colR.append(b); });
  ctx.box.append(status, el("div",{class:"matchgrid"}, colL, colR));
}

function rOrder(ctx){
  const t=ctx.t; const n=t.items.length; let next=0, mistakes=0;
  const seq=el("div",{class:"seq"}); const pool=el("div",{class:"opts"});
  for(let k=0;k<n;k++) seq.append(el("div",{class:"slot"},"Schritt "+(k+1)));
  shuffle(t.items.map((s,i)=>({s,i}))).forEach(o=>{
    const b=el("button",{class:"opt",type:"button"}, el("span",{class:"k"},"?"), el("span",{},o.s));
    b.addEventListener("click",()=>{
      if(ctx.done) return;
      if(o.i===next){ b.remove(); seq.children[next].replaceWith(el("div",{class:"step"}, el("span",{class:"n"},String(next+1)), el("span",{},o.s))); next++;
        if(next===n) finish(ctx, 10*(n-mistakes)/n, el("p",{class:"sub"}, mistakes===0?"Reihenfolge auf Anhieb richtig.":mistakes+" Fehlversuch"+(mistakes===1?"":"e")+".")); }
      else { mistakes++; shakeEl(b); }
    });
    pool.append(b);
  });
  ctx.box.append(seq, el("p",{class:"hint"},"Welcher Schritt kommt als Nächstes?"), pool);
}

function rMulti(ctx){
  const t=ctx.t; const opts=shuffle(t.options.map((o,i)=>({o,i}))); const list=el("div",{class:"opts"}); const sel=new Set();
  opts.forEach(({o,i},k)=>{ const b=el("button",{class:"opt",type:"button","aria-pressed":"false"}, el("span",{class:"k"},String.fromCharCode(65+k)), el("span",{},o)); b.addEventListener("click",()=>{ if(ctx.done) return; if(sel.has(i)){ sel.delete(i); b.classList.remove("is-sel"); b.setAttribute("aria-pressed","false"); } else { sel.add(i); b.classList.add("is-sel"); b.setAttribute("aria-pressed","true"); } }); b.dataset.i=i; list.append(b); });
  const btn=el("button",{class:"btn",type:"button",onclick:()=>{
    if(ctx.done) return; const ans=new Set(t.answers); let hits=0, wrong=0, missed=0;
    [...list.children].forEach(b=>{ const i=+b.dataset.i; b.disabled=true; b.classList.remove("is-sel"); if(ans.has(i)&&sel.has(i)){ hits++; b.classList.add("is-ok"); } else if(!ans.has(i)&&sel.has(i)){ wrong++; b.classList.add("is-bad"); } else if(ans.has(i)){ missed++; b.classList.add("is-missed"); } else b.classList.add("is-lock"); });
    btn.disabled=true;
    finish(ctx, 10*(hits-wrong)/ans.size, el("p",{class:"sub"}, hits+" richtig gewählt"+(wrong?", "+wrong+" zu viel":"")+(missed?", "+missed+" übersehen (gestrichelt)":"")+"."));
  }},"Auswahl prüfen");
  ctx.box.append(list, el("div",{class:"row"}, btn));
}

function rDialog(ctx){
  const t=ctx.t; let i=0, good=0; const tags=new Set(); const chat=el("div",{class:"chat"}); const opts=el("div",{class:"opts"}); const note=el("div");
  ctx.box.append(chat, opts, note);
  function turn(){
    const tr=t.turns[i]; chat.append(el("div",{class:"bubble them"}, el("span",{class:"who"},"Kunde"), tr.them)); opts.innerHTML=""; note.innerHTML="";
    shuffle(tr.options.slice()).forEach((o,k)=>{ opts.append(el("button",{class:"opt",type:"button",onclick:()=>{
      if(opts.dataset.lock) return; opts.dataset.lock="1";
      chat.append(el("div",{class:"bubble me"}, el("span",{class:"who"},"Du"), o.t)); opts.innerHTML=""; delete opts.dataset.lock;
      if(o.good){ good++; (o.tags||[]).forEach(x=>tags.add(x)); }
      note.append(el("div",{class:"note "+(o.good?"ok":"bad")}, o.fb));
      i++;
      if(i<t.turns.length) note.append(el("div",{class:"row end"}, el("button",{class:"btn ghost",type:"button",onclick:turn},"Weiter im Gespräch")));
      else {
        const list=el("ul",{}, t.infos.map((inf,k)=>el("li",{style:"color:"+(tags.has(k)?"var(--ok)":"var(--bad)")}, (tags.has(k)?"✓ ":"✗ ")+inf)));
        finish(ctx, 10*good/t.turns.length, el("div",{}, el("p",{class:"sub"}, el("b",{},good+" von "+t.turns.length+" Antworten sauber. "), "Die sechs Erstinformationen – welche hast du eingeholt?"), list));
      }
      note.scrollIntoView({behavior:"smooth",block:"nearest"});
    }}, el("span",{class:"k"},String.fromCharCode(65+k)), el("span",{},o.t))); });
  }
  turn();
}

function rSpot(ctx){
  const t=ctx.t; const need=t.lines.filter(l=>l.bad).length; const sel=new Set();
  const doc=el("div",{class:"doc"}, el("div",{class:"dhead"},"Angebot · Entwurf"));
  const status=el("div",{class:"counter"},"0 von "+need+" markiert");
  t.lines.forEach((l,i)=>{ const b=el("button",{class:"line",type:"button","aria-pressed":"false"},l.t); b.addEventListener("click",()=>{ if(ctx.done) return; if(sel.has(i)){ sel.delete(i); b.classList.remove("is-sel"); b.setAttribute("aria-pressed","false"); } else if(sel.size<need){ sel.add(i); b.classList.add("is-sel"); b.setAttribute("aria-pressed","true"); } else shakeEl(b); status.textContent=sel.size+" von "+need+" markiert"; }); b.dataset.i=i; doc.append(b); });
  const btn=el("button",{class:"btn",type:"button",onclick:()=>{
    if(ctx.done||sel.size===0) return; let hits=0, fp=0; const why=[];
    [...doc.querySelectorAll(".line")].forEach(b=>{ const i=+b.dataset.i, l=t.lines[i]; b.disabled=true; b.classList.remove("is-sel"); if(l.bad&&sel.has(i)){ hits++; b.classList.add("is-ok"); } else if(!l.bad&&sel.has(i)){ fp++; b.classList.add("is-bad"); } else if(l.bad){ b.classList.add("is-missed"); } if(l.bad) why.push(l.why); });
    btn.disabled=true;
    finish(ctx, 10*(hits-fp)/need, el("div",{}, el("p",{class:"sub"}, hits+" von "+need+" Fehlern gefunden"+(fp?", "+fp+" falsch markiert":"")+"."), el("ul",{}, why.map(w=>el("li",{},w)))));
  }},"Angebot prüfen");
  ctx.box.append(status, doc, el("div",{class:"row"},btn));
}

function rCompare(ctx){
  const t=ctx.t; const grid=el("div",{class:"profiles"});
  t.profiles.forEach((p,i)=>{
    const b=el("button",{class:"profile",type:"button"},
      el("div",{class:"pname"},p.name), el("div",{class:"meta"},p.meta), p.badge?el("span",{class:"badge"},p.badge):null,
      el("ul",{}, p.lines.map(l=>el("li",{},l))), el("div",{class:"meta"},"("+p.note+")"));
    b.addEventListener("click",()=>{ if(ctx.done) return; [...grid.children].forEach((x,j)=>{ x.disabled=true; if(j===t.answer) x.classList.add("is-ok"); }); if(i!==t.answer) b.classList.add("is-bad"); finish(ctx, i===t.answer?10:0); });
    grid.append(b);
  });
  ctx.box.append(grid);
}

/* ---- Station fertig / Ende ---- */
function renderStDone(stage){
  const s=STATIONS[S.st]; const got=S.stScores[S.st]||0, poss=stationPossible(S.st); const lastStation=S.st===STATIONS.length-1;
  stage.append(el("div",{class:"card"},
    el("div",{class:"eyebrow",style:"--seg:"+segVar(S.st)}, el("span",{class:"dot"}), "Station "+(S.st+1)+" geschafft"),
    el("h1",{class:"title"}, s.name),
    el("div",{class:"bigscore"}, String(got), el("small",{}," / "+poss+" Punkte")),
    el("h2",{class:"q",style:"font-size:18px"},"Die drei Merksätze"),
    el("div",{class:"merk"}, s.merk.map((m,i)=>el("div",{class:"m"}, el("span",{class:"n"},String(i+1)), el("span",{},m)))),
    el("div",{class:"row"}, el("button",{class:"btn",type:"button",onclick:()=>{ if(lastStation){ S.view="end"; saveBest(); } else { S.st++; S.ti=0; S.view="intro"; } save(); render(); }}, lastStation ? "Zum Ergebnis" : "Weiter zu Station "+(S.st+2)+": "+STATIONS[S.st+1].name))
  ));
}

function renderEnd(stage){
  const pct=Math.round(100*S.score/MAX); const rank=RANKS.find(r=>pct>=r[0]);
  const nameIn=el("input",{class:"namein",id:"cert-name",type:"text",placeholder:"Dein Name (optional)",value:S.name||"",maxlength:"60"});
  nameIn.addEventListener("input",()=>{ S.name=nameIn.value; save(); nameEl.textContent=S.name||"Energieberater:in in spe"; });
  const nameEl=el("div",{style:"font-family:var(--display);font-weight:700;font-size:20px"}, S.name||"Energieberater:in in spe");
  const copyBtn=el("button",{class:"btn ghost",type:"button",onclick:async()=>{
    const txt="Vom Zertifikat zum Projekt – "+(S.name?S.name+": ":"")+S.score+"/"+MAX+" Punkte ("+pct+" %), Rang: "+rank[1]+"\n"+STATIONS.map((s,i)=>"  "+s.name+": "+(S.stScores[i]||0)+"/"+stationPossible(i)).join("\n");
    try{ await navigator.clipboard.writeText(txt); copyBtn.textContent="Kopiert"; }catch(e){ prompt("Ergebnis zum Kopieren:", txt); }
  }},"Ergebnis kopieren");
  stage.append(el("div",{class:"card"},
    el("div",{class:"eyebrow"},"Fahrplan abgeschlossen"),
    el("div",{class:"cert"},
      el("div",{class:"eyebrow"},"Bescheinigung · Block 8 Teil 1"),
      nameEl,
      el("div",{class:"bigscore"}, String(S.score), el("small",{}," / "+MAX+" Punkte · "+pct+" %")),
      el("div",{class:"rank"}, rank[1]),
      el("p",{class:"sub"}, rank[2]),
      el("div",{class:"bars"}, STATIONS.map((s,i)=>{ const g=S.stScores[i]||0, p=stationPossible(i); return el("div",{class:"bar",style:"--seg:"+segVar(i)}, el("span",{},s.short), el("div",{class:"track"}, el("div",{class:"fill",style:"width:"+Math.round(100*g/p)+"%"})), el("span",{class:"v"},g+"/"+p)); }))
    ),
    el("label",{class:"lbl",for:"cert-name"},"Name auf der Bescheinigung", nameIn),
    el("div",{class:"row"}, copyBtn, el("button",{class:"btn",type:"button",onclick:()=>reset()},"Noch einmal spielen")),
    best ? el("p",{class:"hint"},"Bestes Ergebnis in diesem Browser: "+best.score+" von "+MAX+" Punkten.") : null
  ));
}

/* ---------------- Start ---------------- */
function start(hot){
  load();
  // Beim Laden immer zur Übersicht – von dort aus geht es an der gespeicherten Stelle weiter.
  if(S.view!=="end") S.view="home";
  if(hot && hot.view) S=Object.assign(S,hot);
  if(!["home","intro","task","stdone","end"].includes(S.view)) S.view="home";
  S.st=clamp(S.st,0,STATIONS.length-1);
  if(S.ti>STATIONS[S.st].tasks.length) S.ti=STATIONS[S.st].tasks.length;
  if(S.view==="task" && S.ti>=STATIONS[S.st].tasks.length) S.view="stdone";
  window.claude?.hot?.snapshot?.(()=>S);
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>
