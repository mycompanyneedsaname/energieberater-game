<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finger hoch, Block 8</title>
<meta name="description" content="Fünf Fragen für fünf Minuten: Beamer-Quiz zu Block 8 Teil 1, die Gruppe antwortet mit erhobenen Fingern.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0F1A1C; --panel:#172428; --ink:#EEF3F1; --muted:#9BB0AD; --line:#2C3F43;
  --sun:#F5C542; --sun-ink:#2B2200; --ok:#5FD08A; --ok-bg:#163A27; --bad:#F08A7E; --bad-bg:#4A2320; --pick:#7EC8E3;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(16px,2vw,26px);line-height:1.35;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
.stage{min-height:100%;display:flex;flex-direction:column;padding-inline:clamp(16px,4vw,56px);padding-block:clamp(12px,2vh,24px);gap:clamp(10px,2vh,22px);cursor:pointer;user-select:none;-webkit-user-select:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:clamp(14px,1.6vw,20px);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;gap:8px}
.dots i{width:clamp(10px,1.4vw,16px);height:clamp(10px,1.4vw,16px);border-radius:50%;background:var(--line);display:block}
.dots i.done{background:var(--ok)} .dots i.cur{background:var(--sun)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(22px,3.4vw,46px);color:var(--sun);min-width:2.6ch;text-align:right;letter-spacing:0;text-transform:none}
.timer.zero{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2vh,24px)}
.eyebrow{font-size:clamp(14px,1.7vw,22px);color:var(--sun);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.story{border-left:6px solid var(--sun);padding:4px 0 4px 18px;color:var(--ink);font-size:clamp(15px,1.8vw,24px);max-width:56ch}
h1.q{font-size:clamp(26px,3.6vw,50px);font-weight:800;letter-spacing:-.02em;max-width:22ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.4vw,16px)}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:clamp(8px,1.2vw,16px) clamp(12px,1.6vw,20px);font-size:clamp(15px,1.8vw,24px);line-height:1.3;transition:border-color .15s,background .15s}
.opt .k{font-family:var(--display);font-weight:800;font-size:1.25em;color:var(--sun);min-width:1.2em;line-height:1.05}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);opacity:.85}
.opt.dim{opacity:.4}
.opt.pick{box-shadow:0 0 0 4px var(--pick)}
.opt:hover{border-color:var(--muted)}
.reveal{background:var(--ok-bg);border:2px solid var(--ok);border-radius:14px;padding:clamp(10px,1.4vw,18px) clamp(14px,1.8vw,24px);font-size:clamp(15px,1.7vw,23px);display:flex;flex-direction:column;gap:6px}
.reveal b{font-family:var(--display);font-weight:800;color:var(--ok);font-size:1.15em}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.4vw,16px)}
@media (max-width:700px){.profiles{grid-template-columns:1fr}}
.profile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:clamp(10px,1.4vw,18px);font-size:clamp(14px,1.6vw,22px);line-height:1.3}
.profile .k{font-family:var(--display);font-weight:800;color:var(--sun);font-size:1.3em}
.profile .name{font-weight:600;font-size:1.1em}
.profile .meta{color:var(--muted);font-size:.85em}
.profile .badge{align-self:flex-start;font-size:.7em;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:6px;background:#2A4A3E;color:var(--ok);font-weight:600}
.profile.ok{border-color:var(--ok);background:var(--ok-bg)} .profile.bad{border-color:var(--bad);background:var(--bad-bg);opacity:.85}
.profile.pick{box-shadow:0 0 0 4px var(--pick)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:clamp(13px,1.5vw,19px);color:var(--muted);flex-wrap:wrap}
.foot kbd{font-family:var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:.9em;color:var(--ink)}
.next{background:var(--sun);color:var(--sun-ink);border:0;border-radius:12px;padding:10px 26px;font-weight:600;font-size:clamp(16px,2vw,26px)}
.next:hover{filter:brightness(1.06)}
h1.title{font-size:clamp(40px,8vw,120px);font-weight:800;letter-spacing:-.03em}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.6vw,20px)}
@media (max-width:700px){.rules{grid-template-columns:1fr}}
.rule{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:clamp(12px,1.8vw,24px);display:flex;flex-direction:column;gap:6px;font-size:clamp(16px,2vw,26px)}
.rule b{font-family:var(--display);font-size:2em;color:var(--sun);font-weight:800;line-height:1}
.merk{display:flex;flex-direction:column;gap:clamp(6px,1.2vh,14px)}
.merk div{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:baseline;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:clamp(8px,1.4vw,18px) clamp(12px,1.8vw,22px);font-size:clamp(16px,2vw,27px)}
.merk b{font-family:var(--display);font-weight:800;color:var(--sun);font-size:1.3em}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const TIMER=30;
const Q=[
 {eyebrow:"Frage 1 · Versicherung",
  story:"Bei einer Begehung öffnest du ein Fenster, um die Wanddicke zu messen. Dabei stößt du einen Blumenkasten hinunter. Er trifft eine Person auf dem Gehweg.",
  q:"Welche Versicherung reguliert?",
  opts:["Betriebshaftpflicht","Vermögensschadenhaftpflicht","Rechtsschutz","Keine, das war Fahrlässigkeit"],a:0,
  why:"Personenschaden durch fahrlässiges Verhalten, Haftung nach § 823 BGB. Beratungsfehler mit später sichtbarem Schaden wären die Vermögensschadenhaftpflicht. Beide braucht ihr, und zwar vor dem ersten Projekt: Verstöße vor Vertragsbeginn sind nicht versichert."},
 {eyebrow:"Frage 2 · EEE-Liste", type:"profiles",
  q:"Du bist Hauseigentümer:in und suchst in der EEE-Liste. Wen rufst du an?",
  profiles:[
    {name:"M. Mustermann",meta:"Energieberatung · Musterstadt",lines:["Modul: Wohngebäude"]},
    {name:"M. Mustermann",meta:"Energieberatung · Landkreis Rosenheim",badge:"Netzwerkpartner GIH",lines:["Energieberatung für Ein- und Zweifamilienhäuser im Landkreis Rosenheim. Schwerpunkt iSFP und Baubegleitung, vom ersten Gespräch bis zum Förderantrag.","Leistungen: iSFP · BEG EM · Baubegleitung · Energieausweise"]}
  ],a:1,
  why:"Beide Profile sind formal in Ordnung. Nur das zweite zeigt Spezialisierung, Region und Arbeitsweise. Allein damit hebt man sich von der Konkurrenz ab. Und: früh registrieren, Anträge werden nach Eingangsdatum bearbeitet."},
 {eyebrow:"Frage 3 · Kosten der Listung",
  story:"Zwei Module, Eintragung über Referenzen, eine Nebenadresse.",
  q:"Was kostet das erste Jahr netto?",
  opts:["220 €","370 €","580 €","1.070 €"],a:2,
  why:"Prüfung 2 × 100 € + Referenzzuschlag 200 € + Jahresbeitrag zwei Module 170 € + Nebenadresse 10 € = 580 € netto, 690,20 € mit MwSt. Die Listung ist eine echte Investition, und ohne Eintrag gibt es keine Förderanträge."},
 {eyebrow:"Frage 4 · Erstes Projekt",
  story:"Herr Weber hat dein Angebot für den Vor-Ort-Termin bekommen und will sofort den Vertrag unterschreiben.",
  q:"Was muss vorher passieren?",
  opts:["Nichts, erst der Vertrag, dann kümmerst du dich um die Förderung","Er stellt den Förderantrag beim BAFA und gibt deine Beraternummer an","Du stellst den Förderantrag für ihn, dazu braucht er nichts zu tun","Die Vor-Ort-Begehung, damit du weißt, was förderfähig ist"],a:1,
  why:"Die Förderung wird beantragt, bevor das Vertragsverhältnis eingegangen wird. Der Kunde stellt den Antrag online beim BAFA mit deiner Beraternummer. Das gehört ins erste Gespräch, zusammen mit den sechs Erstinformationen."},
 {eyebrow:"Frage 5 · Energieausweise",
  story:"Das DIBt hat deinen Energieausweis in Stufe 1 erfasst und in den Daten einen Fehler gefunden.",
  q:"Was passiert jetzt?",
  opts:["Nichts. Stufe 1 ist rein statistisch, es gibt keine Rückfragen","Das DIBt meldet den Fehler an die Bauaufsichtsbehörde","Du musst den Ausweis neu ausstellen","Stufe 2 wird automatisch ausgelöst"],a:0,
  why:"Stufe 1 dient ausschließlich statistischen Zwecken, nur die Ausweisnummern gehen an die Behörde. Stufe 2 und 3 sind unabhängige Stichproben der Bauaufsicht nach § 99 Abs. 6 GModG, Rückfragen werden schriftlich beantwortet, kein Neuausstellen ohne Aufforderung. Bußgeld bis 5.000 €."}
];
const MERK=["Ohne EEE-Listung keine Förderanträge. Früh registrieren, Profil pflegen.","Energieausweise: DIBt-Konto, 6,90 € je Nummer, Stufe 1 ist Statistik.","Beratungsfehler: Vermögensschadenhaftpflicht. Blumenkasten: Betriebshaftpflicht. Beides vor dem ersten Projekt.","Akquise: aktive und passive Kanäle, beide nutzen.","Förderung beantragen, bevor der Vertrag steht. Angebot: Leistung klar beschreiben.","Die Begehung ist der beste Zeitpunkt für Daten. Wärmebilder brauchen Schulung."];

let step=-1, phase="ask", pick=null, left=TIMER, tick=null;
const stage=document.getElementById("stage");
const KEYS=["A","B","C","D"];

function render(){
  clearInterval(tick); stage.innerHTML="";
  if(step<0){ stage.innerHTML=`<div class="top"><span>Block 8 Teil 1 · Vom Zertifikat zum ersten Projekt</span><span>5 Fragen · 5 Minuten</span></div>
   <div class="main"><h1 class="title">Finger hoch.</h1>
   <div class="rules"><div class="rule"><b>1</b>Frage lesen. Vier Antworten, A bis D.</div><div class="rule"><b>2</b>${TIMER} Sekunden. Dann alle gleichzeitig: ein bis vier Finger hoch.</div><div class="rule"><b>3</b>Auflösung mit dem Merksatz dahinter.</div></div></div>
   <div class="foot"><span>Klick oder <kbd>Leertaste</kbd>: weiter · <kbd>1</kbd>–<kbd>4</kbd>: Gruppenantwort markieren und auflösen</span><button class="next" type="button">Los</button></div>`; return; }
  if(step>=Q.length){ stage.innerHTML=`<div class="top"><span>Das war's</span><span>Sechs Merksätze</span></div><div class="main"><div class="merk">${MERK.map((m,i)=>`<div><b>${i+1}</b><span>${m}</span></div>`).join("")}</div></div>
   <div class="foot"><span>Zum Vertiefen: Stationen-Quiz und Adventure im selben Ordner.</span><button class="next" type="button">Von vorn</button></div>`; return; }
  const q=Q[step];
  const dots=Q.map((_,i)=>`<i class="${i<step?"done":i===step?"cur":""}"></i>`).join("");
  let body;
  if(q.type==="profiles"){
    body=`<div class="profiles">${q.profiles.map((p,i)=>`<button class="profile ${cls(i)}" type="button" data-i="${i}"><span class="k">${KEYS[i]}</span><span class="name">${p.name}</span><span class="meta">${p.meta}</span>${p.badge?`<span class="badge">${p.badge}</span>`:""}${p.lines.map(l=>`<span>${l}</span>`).join("")}</button>`).join("")}</div>`;
  } else {
    body=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt ${cls(i)}" type="button" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${o}</span></button>`).join("")}</div>`;
  }
  const reveal=phase==="reveal"?`<div class="reveal"><b>${KEYS[q.a]} ist richtig${pick!=null&&pick!==q.a?", die Gruppe lag bei "+KEYS[pick]:pick===q.a?", die Gruppe auch":""}.</b><span>${q.why}</span></div>`:"";
  stage.innerHTML=`<div class="top"><div class="dots">${dots}</div><span class="timer" id="timer">${left}</span></div>
   <div class="main"><div class="eyebrow">${q.eyebrow}</div>${q.story?`<p class="story">${q.story}</p>`:""}<h1 class="q">${q.q}</h1>${body}${reveal}</div>
   <div class="foot"><span>${phase==="ask"?"<kbd>1</kbd>–<kbd>4</kbd> markiert die Gruppenantwort und löst auf · <kbd>Leertaste</kbd> löst ohne Markierung auf":"<kbd>Leertaste</kbd> oder Klick: nächste Frage"}</span><button class="next" type="button">${phase==="ask"?"Auflösen":step===Q.length-1?"Zum Schluss":"Nächste Frage"}</button></div>`;
  if(phase==="ask"){ left=TIMER; const t=document.getElementById("timer"); t.textContent=left; tick=setInterval(()=>{ left--; if(left<=0){ left=0; t.classList.add("zero"); t.textContent="Finger!"; clearInterval(tick); } else t.textContent=left; },1000); }
  else { const t=document.getElementById("timer"); t.textContent="✓"; t.classList.remove("zero"); }
}
function cls(i){ if(phase!=="reveal") return ""; const q=Q[step]; return (i===q.a?"ok":i===pick?"bad":"dim")+(i===pick?" pick":""); }
function next(){ if(step<0){ step=0; phase="ask"; pick=null; } else if(step>=Q.length){ step=-1; } else if(phase==="ask"){ phase="reveal"; } else { step++; phase="ask"; pick=null; } render(); }
function choosePick(i){ if(step<0||step>=Q.length||phase!=="ask") return; const q=Q[step]; const n=q.type==="profiles"?q.profiles.length:q.opts.length; if(i>=n) return; pick=i; phase="reveal"; render(); }
stage.addEventListener("click",e=>{ const b=e.target.closest("[data-i]"); if(b&&phase==="ask"){ choosePick(+b.dataset.i); return; } next(); });
document.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="ArrowRight"||e.key==="Enter"){ e.preventDefault(); next(); } else if(e.key==="ArrowLeft"&&step>0){ step--; phase="reveal"; pick=null; render(); } else if(/^[1-4]$/.test(e.key)) choosePick(+e.key-1); });
render();
</script>
</body>
</html>
